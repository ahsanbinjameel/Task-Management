<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkflowApp — Dev Console</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e222d; --line: #2a2f3d;
    --text: #e6e8ee; --muted: #9aa2b4; --accent: #5b8cff; --accent-2: #7c5bff;
    --ok: #35c48a; --warn: #e8b23a; --bad: #ef5f6b; --info: #4fc3f7;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: var(--muted); font-weight: 400; }
  #who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  #who b { color: var(--text); }

  nav { display: flex; gap: 4px; padding: 10px 20px 0; flex-wrap: wrap; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 7px 14px; border-radius: var(--radius) var(--radius) 0 0; cursor: pointer; font-size: 13px;
  }
  nav button:hover { color: var(--text); }
  nav button.active { background: var(--panel); color: var(--text); border-color: var(--line); border-bottom-color: var(--panel); }

  main { padding: 0 20px 40px; }
  .view { display: none; }
  .view.active { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .card.wide { grid-column: 1 / -1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.clickable:hover { background: var(--panel-2); cursor: pointer; }
  .scroll { overflow-x: auto; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: rgba(53,196,138,.15); color: var(--ok); }
  .pill.warn { background: rgba(232,178,58,.15); color: var(--warn); }
  .pill.bad { background: rgba(239,95,107,.15); color: var(--bad); }
  .pill.info { background: rgba(79,195,247,.15); color: var(--info); }
  .pill.mute { background: rgba(154,162,180,.15); color: var(--muted); }

  button.act {
    background: var(--accent); color: #fff; border: 0; padding: 7px 13px;
    border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500;
  }
  button.act:hover { filter: brightness(1.12); }
  button.act.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  button.act.danger { background: var(--bad); }
  button.act.good { background: var(--ok); }
  button.act:disabled { opacity: .4; cursor: not-allowed; }

  input, select, textarea {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: 7px; font: inherit; width: 100%;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .n { font-size: 26px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; }

  .muted { color: var(--muted); }
  .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
  .empty { color: var(--muted); padding: 18px; text-align: center; font-style: italic; }

  #toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 420px; z-index: 100;
    display: flex; flex-direction: column; gap: 8px;
  }
  #toast div {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 7px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  #toast div.bad { border-left-color: var(--bad); }
  #toast div.ok { border-left-color: var(--ok); }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; width: min(560px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 4px; font-size: 15px; }

  .login-wrap { max-width: 380px; margin: 60px auto; }
  .login-wrap .card { padding: 24px; }
  .accounts { margin-top: 14px; font-size: 12px; }
  .accounts button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 11.5px; margin: 3px 3px 0 0;
  }
  .timeline-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .timeline-bar span { display: block; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap">
  <div class="card">
    <h2>WorkflowApp — Dev Console</h2>
    <label>Username</label>
    <input id="u" value="wu" autocomplete="username">
    <label>Password</label>
    <input id="p" type="password" value="Demo!Pass123" autocomplete="current-password">
    <div style="margin-top:16px"><button class="act" style="width:100%" onclick="login()">Sign in</button></div>
    <div class="accounts">
      <div class="muted">Demo accounts (password <span class="mono">Demo!Pass123</span>):</div>
      <div id="quick"></div>
      <div class="muted" style="margin-top:8px">Admin: <span class="mono">admin / ChangeMe!2024</span></div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none">
<header>
  <h1>WorkflowApp <span>· dev console</span></h1>
  <div id="who"></div>
</header>

<nav>
  <button data-view="dash" class="active">Dashboard</button>
  <button data-view="requests">Requests</button>
  <button data-view="triage">Triage</button>
  <button data-view="assign">Assignment</button>
  <button data-view="work">My Work</button>
  <button data-view="people">Workforce</button>
</nav>

<main>
  <section id="v-dash" class="view active"></section>
  <section id="v-requests" class="view"></section>
  <section id="v-triage" class="view"></section>
  <section id="v-assign" class="view"></section>
  <section id="v-work" class="view"></section>
  <section id="v-people" class="view"></section>
</main>
</div>

<dialog id="modal"><div id="modal-body"></div></dialog>

<script>
// ---------------------------------------------------------------- state + transport
const S = { access: null, refresh: null, me: null, taskId: null, requestId: null };
const DEMO = [['rachel','Requester'],['victor','Reviewer'],['amara','Coordinator'],
              ['wu','Worker'],['priya','Worker'],['quentin','QC'],['morgan','Management']];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = kind || '';
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

// Single place the access token is attached and a 401 is retried after a refresh.
async function api(path, options = {}, retry = true) {
  const opt = { ...options, headers: { ...(options.headers || {}) } };
  if (S.access) opt.headers['Authorization'] = 'Bearer ' + S.access;
  if (opt.body && !(opt.body instanceof FormData)) opt.headers['Content-Type'] = 'application/json';

  const res = await fetch('/api' + path, opt);

  if (res.status === 401 && retry && S.refresh) {
    const ok = await refreshToken();
    if (ok) return api(path, options, false);
  }

  if (res.status === 204) return null;

  const text = await res.text();
  const data = text ? JSON.parse(text) : null;

  if (!res.ok) {
    // The API always answers failures as ProblemDetails, so there is one shape to read.
    const message = data?.title || data?.detail || ('HTTP ' + res.status);
    const err = new Error(message);
    err.code = data?.code;
    throw err;
  }
  return data;
}

async function refreshToken() {
  try {
    const r = await fetch('/api/auth/refresh', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: S.refresh })
    });
    if (!r.ok) return false;
    const d = await r.json();
    S.access = d.accessToken; S.refresh = d.refreshToken;
    return true;
  } catch { return false; }
}

async function login() {
  try {
    const d = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ userName: $('u').value, password: $('p').value })
    });
    S.access = d.accessToken; S.refresh = d.refreshToken; S.me = d.user;
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    renderWho();
    show('dash');
  } catch (e) { toast(e.message, 'bad'); }
}

async function logout() {
  try { await api('/auth/logout', { method: 'POST', body: JSON.stringify({ refreshToken: S.refresh }) }); } catch {}
  S.access = S.refresh = S.me = null;
  $('app').style.display = 'none';
  $('login').style.display = 'block';
}

const can = (p) => S.me?.permissions?.includes(p);

// Tabs a user cannot use are hidden. This is convenience only — the server is the boundary.
const TAB_PERMISSION = { triage: 'Task.Review', assign: 'Task.Assign', work: 'Task.Work' };

function applyTabVisibility() {
  document.querySelectorAll('nav button').forEach(b => {
    const needed = TAB_PERMISSION[b.dataset.view];
    b.style.display = (needed && !can(needed)) ? 'none' : '';
  });
}

function renderWho() {
  $('who').innerHTML =
    `<span><b>${esc(S.me.displayName)}</b></span>` +
    `<span class="pill mute">${esc(S.me.roles.join(', ') || 'no roles')}</span>` +
    `<span id="shift-pill"></span>` +
    `<button class="act ghost" onclick="logout()">Sign out</button>`;
  applyTabVisibility();
  refreshShiftPill();
}

// ---------------------------------------------------------------- navigation
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => show(b.dataset.view));

function show(view) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('v-' + view).classList.add('active');
  ({ dash: renderDash, requests: renderRequests, triage: renderTriage,
     assign: renderAssign, work: renderWork, people: renderPeople }[view])();
}

// ---------------------------------------------------------------- shared bits
const STATUS_TONE = {
  Requested:'mute', AwaitingReview:'info', ClarificationRequired:'warn', Approved:'ok',
  ReadyForAssignment:'info', Assigned:'info', ReadyToStart:'info',
  InProgress:'ok', Paused:'warn', Blocked:'bad',
  CompletedReadyForQC:'info', QCReview:'info', QCFailedRework:'bad', QCPassed:'ok',
  ReadyForClosure:'ok', Closed:'mute', Cancelled:'mute', Duplicate:'mute',
  Submitted:'info', InReview:'warn', Rejected:'bad', Deferred:'mute', Escalated:'bad',
  Working:'ok', Available:'info', Break:'warn', Lunch:'warn', Meeting:'warn',
  TemporarilyAway:'warn', ShiftEnded:'mute', NotLoggedIn:'mute', LoggedInShiftNotStarted:'mute'
};
const PRIORITY_TONE = { Critical:'bad', High:'warn', Normal:'info', Low:'mute' };
const words = (s) => String(s ?? '').replace(/([a-z])([A-Z])/g, '$1 $2');
const pill = (v, map) => `<span class="pill ${map[v] || 'mute'}">${esc(words(v))}</span>`;

function dur(ts) {
  if (!ts) return '—';
  const [h, m] = ts.split(':');
  const hh = parseInt(h, 10), mm = parseInt(m, 10);
  if (!hh && !mm) return '—';
  return (hh ? hh + 'h ' : '') + mm + 'm';
}
const when = (d) => d ? new Date(d).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const table = (head, rows) => rows.length
  ? `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : `<div class="empty">Nothing here.</div>`;

function modal(html) { $('modal-body').innerHTML = html; $('modal').showModal(); }
const closeModal = () => $('modal').close();

// ---------------------------------------------------------------- dashboard
async function renderDash() {
  const el = $('v-dash');
  el.innerHTML = '<div class="grid"><div class="card wide"><div class="empty">Loading…</div></div></div>';

  const [queue, session, shift] = await Promise.all([
    api('/tasks/my-queue').catch(() => []),
    api('/tasks/active-session').catch(() => null),
    api('/shifts/current').catch(() => null)
  ]);

  const active = queue.filter(t => t.status === 'InProgress').length;
  const blocked = queue.filter(t => t.status === 'Blocked').length;

  let boards = '';
  if (can('Task.Review')) {
    const rq = await api('/requests/review-queue?pageSize=5').catch(() => null);
    boards += card('Awaiting triage', table(['#','Title','Urgency'],
      (rq?.items || []).map(r => `<tr class="clickable" onclick="openRequest(${r.id})">
        <td class="mono">${esc(r.requestNumber)}</td><td>${esc(r.title)}</td>
        <td>${pill(r.requestedUrgency, PRIORITY_TONE)}</td></tr>`)));
  }
  if (can('Task.Assign')) {
    const aq = await api('/tasks/assignment-queue?pageSize=5').catch(() => null);
    boards += card('Waiting for an assignee', table(['#','Title','Priority'],
      (aq?.items || []).map(t => `<tr class="clickable" onclick="openTask(${t.id})">
        <td class="mono">${esc(t.taskNumber)}</td><td>${esc(t.title)}</td>
        <td>${pill(t.priority, PRIORITY_TONE)}</td></tr>`)));
  }

  el.innerHTML = `<div class="grid">
    ${card('At a glance', `<div class="stats">
      ${stat(queue.length, 'My open tasks')}
      ${stat(active, 'In progress')}
      ${stat(blocked, 'Blocked')}
      ${stat(!shift?.isShiftTracked ? '—' : (shift.isOnShift ? 'On' : 'Off'), 'Shift')}
    </div>`)}
    ${card('Shift &amp; availability', shiftPanel(shift))}
    ${!shift?.isShiftTracked ? '' : card('Timer', session
      ? `<div class="stat"><span class="l">Running since</span><span class="n" style="font-size:18px">${when(session.sessionStart)}</span></div>
         <div class="row" style="margin-top:12px">
           <button class="act warn" onclick="askPause(${session.taskId})">Pause</button>
           <button class="act ghost" onclick="openTask(${session.taskId})">Open task</button>
         </div>`
      : `<div class="muted">No timer running. Start a task from <b>My Work</b>.</div>`)}
    ${boards}
    ${!can('Task.Work') ? '' : card('My queue', table(['#','Title','Status','Priority','Worked'],
      queue.map(t => `<tr class="clickable" onclick="openTask(${t.id})">
        <td class="mono">${esc(t.taskNumber)}</td><td>${esc(t.title)}</td>
        <td>${pill(t.status, STATUS_TONE)}</td><td>${pill(t.priority, PRIORITY_TONE)}</td>
        <td class="mono">${dur(t.totalWorkedTime)}</td></tr>`)), true)}
  </div>`;
}

const card = (title, body, wide) => `<div class="card${wide ? ' wide' : ''}"><h2>${title}</h2>${body}</div>`;
const stat = (n, l) => `<div class="stat"><span class="n">${esc(n)}</span><span class="l">${l}</span></div>`;

function shiftPanel(s) {
  if (!s) return '<div class="muted">Unavailable.</div>';
  // Only people who execute tasks are on the clock. For everyone else there is nothing to show.
  if (!s.isShiftTracked) {
    return `<div class="muted">Your attendance is not tracked — shifts apply to people who work
      on tasks. You are signed in as ${esc(S.me.roles.join(', ') || 'no role')}.</div>`;
  }
  if (!s.isOnShift) {
    return `<div class="muted" style="margin-bottom:12px">Currently ${pill(s.state, STATUS_TONE)}</div>
      <button class="act good" onclick="act('/shifts/start','POST',null,'Shift started')">Start shift</button>`;
  }
  const options = (s.availableStates || []).filter(x => x !== s.state)
    .map(x => `<button class="act ghost" onclick="setState('${x}')">${esc(words(x))}</button>`).join('');
  return `<div style="margin-bottom:10px">Currently ${pill(s.state, STATUS_TONE)}
      <span class="muted mono">since ${when(s.stateSince)}</span></div>
    <div class="row">${options}
      <button class="act danger" onclick="act('/shifts/end','POST',{},'Shift ended')">End shift</button></div>`;
}

async function refreshShiftPill() {
  const s = await api('/shifts/current').catch(() => null);
  const el = $('shift-pill');
  if (el) el.innerHTML = s && s.isShiftTracked ? pill(s.state, STATUS_TONE) : '';
}

const setState = (state) => act('/shifts/state', 'PUT', { state }, 'Availability updated');

async function act(path, method, body, okMsg) {
  try {
    await api(path, { method, body: body === null ? undefined : JSON.stringify(body) });
    toast(okMsg || 'Done', 'ok');
    refreshShiftPill();
    show(document.querySelector('nav button.active').dataset.view);
  } catch (e) { toast(e.message, 'bad'); }
}

// ---------------------------------------------------------------- requests
async function renderRequests() {
  const el = $('v-requests');
  const r = await api('/requests?pageSize=50').catch(e => { toast(e.message,'bad'); return null; });

  el.innerHTML = `<div class="grid">
    ${can('Request.Create') ? card('Submit a request', requestForm()) : ''}
    ${card(`Requests <span class="muted">(${r?.totalCount ?? 0})</span>`, table(
      ['#','Title','Type','Urgency','Status','Task','Raised'],
      (r?.items || []).map(x => `<tr class="clickable" onclick="openRequest(${x.id})">
        <td class="mono">${esc(x.requestNumber)}</td><td>${esc(x.title)}</td>
        <td class="muted">${esc(words(x.type))}</td>
        <td>${pill(x.requestedUrgency, PRIORITY_TONE)}</td>
        <td>${pill(x.status, STATUS_TONE)}</td>
        <td class="mono muted">${x.generatedTaskId ? '#' + x.generatedTaskId : '—'}</td>
        <td class="muted">${when(x.requestedAt)}</td></tr>`)), true)}
  </div>`;
}

const requestForm = () => `
  <label>Title</label><input id="r-title" placeholder="Short summary of the problem">
  <label>Description</label><textarea id="r-desc" rows="3" placeholder="What is happening, and what should happen?"></textarea>
  <div class="row" style="margin-top:10px">
    <div style="flex:1"><label>Type</label><select id="r-type">
      ${['Bug','ChangeRequest','NewFeature','Support','Configuration','Database','Report','Investigation','DataCorrection','Infrastructure','Other']
        .map(t => `<option value="${t}">${words(t)}</option>`).join('')}
    </select></div>
    <div style="flex:1"><label>Urgency</label><select id="r-urg">
      ${['Critical','High','Normal','Low'].map(u => `<option value="${u}"${u==='Normal'?' selected':''}>${u}</option>`).join('')}
    </select></div>
  </div>
  <div style="margin-top:14px"><button class="act" onclick="submitRequest()">Submit</button></div>
  <div class="muted" style="margin-top:8px;font-size:12px">
    Submitting does not create work. A reviewer has to approve it first.</div>`;

async function submitRequest() {
  try {
    const d = await api('/requests', { method: 'POST', body: JSON.stringify({
      title: $('r-title').value, description: $('r-desc').value,
      type: $('r-type').value, requestedUrgency: $('r-urg').value })});
    toast('Created ' + d.requestNumber, 'ok');
    renderRequests();
  } catch (e) { toast(e.message, 'bad'); }
}

async function openRequest(id) {
  try {
    const r = await api('/requests/' + id);
    S.requestId = id;
    const thread = r.clarifications.map(c => `
      <div style="border-left:2px solid var(--line);padding-left:10px;margin:10px 0">
        <div class="muted mono" style="font-size:11px">${when(c.askedAt)}</div>
        <div>${esc(c.question)}</div>
        ${c.answer ? `<div style="margin-top:6px;color:var(--ok)">↳ ${esc(c.answer)}</div>`
                   : `<div class="row" style="margin-top:6px">
                        <input id="ans-${c.id}" placeholder="Answer…" style="flex:1;min-width:200px">
                        <button class="act" onclick="answer(${c.id})">Reply</button></div>`}
      </div>`).join('') || '<div class="muted">No clarifications.</div>';

    modal(`<h3>${esc(r.requestNumber)} — ${esc(r.title)}</h3>
      <div class="row" style="margin:8px 0 14px">
        ${pill(r.status, STATUS_TONE)} ${pill(r.requestedUrgency, PRIORITY_TONE)}
        <span class="muted">${esc(r.requestedByDisplayName)} · ${when(r.requestedAt)}</span>
      </div>
      <div style="white-space:pre-wrap;background:var(--panel-2);padding:12px;border-radius:7px">${esc(r.description)}</div>
      ${r.generatedTaskId ? `<div style="margin-top:12px" class="pill ok">Approved → task #${r.generatedTaskId}</div>` : ''}
      <h2 style="margin-top:18px;font-size:12px;color:var(--muted)">CLARIFICATIONS</h2>${thread}
      <div class="row" style="margin-top:18px;justify-content:flex-end">
        ${can('Task.Review') && ['Submitted','InReview','ClarificationRequired'].includes(r.status)
          ? `<button class="act" onclick="closeModal();triagePanel(${r.id})">Triage this</button>` : ''}
        <button class="act ghost" onclick="closeModal()">Close</button></div>`);
  } catch (e) { toast(e.message, 'bad'); }
}

async function answer(cid) {
  try {
    await api(`/requests/clarifications/${cid}/answer`, {
      method: 'POST', body: JSON.stringify({ answer: $('ans-' + cid).value }) });
    toast('Answered — back to the review queue', 'ok');
    closeModal(); openRequest(S.requestId);
  } catch (e) { toast(e.message, 'bad'); }
}

// ---------------------------------------------------------------- triage
async function renderTriage() {
  const el = $('v-triage');
  if (!can('Task.Review')) { el.innerHTML = card('Triage', '<div class="empty">You do not have Task.Review.</div>'); return; }

  const q = await api('/requests/review-queue?pageSize=50').catch(() => null);
  el.innerHTML = `<div class="grid">${card(
    `Review queue <span class="muted">(${q?.totalCount ?? 0})</span>`,
    table(['#','Title','Type','Urgency','Status','Raised','']. map(h=>h),
      (q?.items || []).map(r => `<tr>
        <td class="mono">${esc(r.requestNumber)}</td>
        <td class="clickable" onclick="openRequest(${r.id})">${esc(r.title)}</td>
        <td class="muted">${esc(words(r.type))}</td>
        <td>${pill(r.requestedUrgency, PRIORITY_TONE)}</td>
        <td>${pill(r.status, STATUS_TONE)}</td>
        <td class="muted">${when(r.requestedAt)}</td>
        <td><button class="act" onclick="triagePanel(${r.id})">Decide</button></td></tr>`)), true)}
    <div class="card wide"><h2>How triage works</h2>
      <div class="muted">Six outcomes; only <b>Approve</b> creates a task. Reject, duplicate and defer
      close the request without ever reaching a worker queue. Clarification sends it back to the
      requester, and answering returns it here — it never skips ahead to approved.</div></div>
  </div>`;
}

function triagePanel(id) {
  modal(`<h3>Triage decision</h3>
    <label>Outcome</label>
    <select id="t-out" onchange="triageFields()">
      <option value="Approve">Approve — creates a task</option>
      <option value="RequestClarification">Request clarification</option>
      <option value="Reject">Reject</option>
      <option value="MarkDuplicate">Mark duplicate</option>
      <option value="Defer">Defer</option>
      <option value="Escalate">Escalate</option>
    </select>
    <div id="t-extra"></div>
    <label>Reason / question</label>
    <textarea id="t-reason" rows="2" placeholder="Required for reject, clarification, duplicate and defer"></textarea>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="act ghost" onclick="closeModal()">Cancel</button>
      <button class="act" onclick="submitTriage(${id})">Record decision</button></div>`);
  triageFields();
}

function triageFields() {
  const out = $('t-out').value;
  $('t-extra').innerHTML =
    out === 'Approve' ? `
      <div class="row"><div style="flex:1"><label>Approved priority</label>
        <select id="t-pri">${['Critical','High','Normal','Low'].map(p=>`<option${p==='Normal'?' selected':''}>${p}</option>`).join('')}</select></div>
      <div style="flex:1"><label>Estimate (hours)</label><input id="t-est" type="number" step="0.5" placeholder="optional"></div></div>
      <div class="muted" style="font-size:12px;margin-top:8px">The requester's urgency is advisory — this is the priority that schedules the work.</div>`
    : out === 'MarkDuplicate' ? `<label>Duplicate of request id</label><input id="t-dup" type="number" placeholder="e.g. 1">`
    : '';
}

async function submitTriage(id) {
  const body = { outcome: $('t-out').value, reason: $('t-reason').value };
  if ($('t-pri')) body.approvedPriority = $('t-pri').value;
  if ($('t-est')?.value) body.estimatedEffortHours = parseFloat($('t-est').value);
  if ($('t-dup')?.value) body.duplicateOfRequestId = parseInt($('t-dup').value, 10);

  try {
    const r = await api(`/requests/${id}/triage`, { method: 'POST', body: JSON.stringify(body) });
    toast(r.createdTaskNumber ? `Approved → created ${r.createdTaskNumber}` : `Recorded: ${words(r.status)}`, 'ok');
    closeModal(); renderTriage();
  } catch (e) { toast(e.message, 'bad'); }
}

// ---------------------------------------------------------------- assignment
async function renderAssign() {
  const el = $('v-assign');
  if (!can('Task.Assign')) { el.innerHTML = card('Assignment', '<div class="empty">You do not have Task.Assign.</div>'); return; }

  const [q, load, users] = await Promise.all([
    api('/tasks/assignment-queue?pageSize=50').catch(() => null),
    api('/tasks/workload').catch(() => []),
    api('/tasks/assignable-users').catch(() => [])
  ]);
  window.__users = users || [];

  el.innerHTML = `<div class="grid">
    ${card(`Unassigned work <span class="muted">(${q?.totalCount ?? 0})</span>`, table(
      ['#','Title','Priority','Due','Est.',''],
      (q?.items || []).map(t => `<tr>
        <td class="mono">${esc(t.taskNumber)}</td>
        <td class="clickable" onclick="openTask(${t.id})">${esc(t.title)}</td>
        <td>${pill(t.priority, PRIORITY_TONE)}</td>
        <td class="muted">${when(t.dueDate)}</td>
        <td class="mono muted">${t.estimatedEffortHours ?? '—'}h</td>
        <td><button class="act" onclick="assignPanel(${t.id})">Assign</button></td></tr>`)), true)}
    ${card('Workload', table(['Person','State','Open','Running','Blocked','Est. hours','On now'],
      load.map(w => `<tr><td>${esc(w.displayName)}</td>
        <td>${pill(w.workforceState, STATUS_TONE)}</td>
        <td class="mono">${w.openTaskCount}</td><td class="mono">${w.inProgressCount}</td>
        <td class="mono">${w.blockedCount}</td><td class="mono">${w.estimatedHoursOutstanding}</td>
        <td class="mono muted">${esc(w.activeTaskNumber || '—')}</td></tr>`)), true)}
  </div>`;
}

function assignPanel(taskId) {
  const opts = (window.__users || []).map(u => `<option value="${u.id}">${esc(u.displayName)}</option>`).join('');
  modal(`<h3>Assign task</h3>
    <label>Assignee</label><select id="a-user">${opts}</select>
    <label>Reason (required when reassigning)</label><input id="a-reason" placeholder="optional for a first assignment">
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="act ghost" onclick="closeModal()">Cancel</button>
      <button class="act" onclick="doAssign(${taskId})">Assign</button></div>`);
}

async function doAssign(taskId) {
  try {
    await api(`/tasks/${taskId}/assignee`, { method: 'PUT', body: JSON.stringify({
      assigneeUserId: parseInt($('a-user').value, 10), reason: $('a-reason').value || null })});
    toast('Assigned', 'ok'); closeModal(); renderAssign();
  } catch (e) { toast(e.message, 'bad'); }
}

// ---------------------------------------------------------------- my work
async function renderWork() {
  const el = $('v-work');
  const [queue, session] = await Promise.all([
    api('/tasks/my-queue').catch(() => []),
    api('/tasks/active-session').catch(() => null)
  ]);

  el.innerHTML = `<div class="grid">
    ${card('Timer', session
      ? `<div>Running on task #${session.taskId} since <b>${when(session.sessionStart)}</b></div>
         <div class="row" style="margin-top:12px">
           <button class="act warn" onclick="askPause(${session.taskId})">Pause</button>
           <button class="act danger" onclick="askBlock(${session.taskId})">Block</button>
           <button class="act good" onclick="askComplete(${session.taskId})">Complete</button></div>`
      : '<div class="muted">Nothing running. Start a task below — you need an open shift first.</div>')}
    ${card('One session at a time', `<div class="muted">Starting a second task while one is running is
      refused. Use <b>Interrupt</b> on an urgent task instead: it pauses the current one, keeping its
      recorded time, and starts the new one in a single step.</div>`)}
    ${card(`My queue <span class="muted">(${queue.length})</span>`, table(
      ['#','Title','Status','Priority','Worked','Actions'],
      queue.map(t => `<tr>
        <td class="mono">${esc(t.taskNumber)}</td>
        <td class="clickable" onclick="openTask(${t.id})">${esc(t.title)}</td>
        <td>${pill(t.status, STATUS_TONE)}</td>
        <td>${pill(t.priority, PRIORITY_TONE)}</td>
        <td class="mono">${dur(t.totalWorkedTime)}</td>
        <td><div class="row">${workButtons(t, session)}</div></td></tr>`)), true)}
  </div>`;
}

function workButtons(t, session) {
  const running = session && session.taskId === t.id;
  if (running) return `<button class="act warn" onclick="askPause(${t.id})">Pause</button>
                       <button class="act good" onclick="askComplete(${t.id})">Complete</button>`;
  if (['Assigned','ReadyToStart','Paused','Blocked','QCFailedRework','Reopened'].includes(t.status)) {
    return `<button class="act" onclick="startTask(${t.id})">Start</button>` +
           (session ? `<button class="act ghost" onclick="interrupt(${t.id})">Interrupt</button>` : '');
  }
  return '<span class="muted">—</span>';
}

const startTask = (id) => act(`/tasks/${id}/start`, 'POST', null, 'Timer started');

async function interrupt(id) {
  const reasons = await api('/tasks/pause-reasons').catch(() => []);
  modal(`<h3>Emergency interrupt</h3>
    <div class="muted" style="margin-bottom:10px">The running task is paused — its recorded time is
      kept and it can be resumed — and this one starts immediately.</div>
    <label>Why are you switching?</label>${reasonSelect(reasons)}
    <label>Comment</label><input id="w-comment" placeholder="optional">
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="act ghost" onclick="closeModal()">Cancel</button>
      <button class="act" onclick="doInterrupt(${id})">Switch to this task</button></div>`);
}

async function doInterrupt(id) {
  try {
    await api('/tasks/interrupt', { method: 'POST', body: JSON.stringify({
      taskId: id, pauseReasonId: intOrNull($('w-reason').value), comment: $('w-comment').value || null })});
    toast('Switched', 'ok'); closeModal(); renderWork();
  } catch (e) { toast(e.message, 'bad'); }
}

const intOrNull = (v) => v ? parseInt(v, 10) : null;
const reasonSelect = (rs) => `<select id="w-reason"><option value="">— select —</option>` +
  rs.map(r => `<option value="${r.id}">${esc(r.name)}${r.requiresComment ? ' (comment required)' : ''}</option>`).join('') + '</select>';

async function askPause(id) { await stopDialog(id, 'pause', 'Pause work'); }
async function askBlock(id) { await stopDialog(id, 'block', 'Block this task'); }

async function stopDialog(id, verb, title) {
  const reasons = await api('/tasks/pause-reasons').catch(() => []);
  modal(`<h3>${title}</h3>
    <label>Reason</label>${reasonSelect(reasons)}
    <label>Comment</label><input id="w-comment" placeholder="required for some reasons">
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="act ghost" onclick="closeModal()">Cancel</button>
      <button class="act" onclick="doStop(${id},'${verb}')">Confirm</button></div>`);
}

async function doStop(id, verb) {
  try {
    await api(`/tasks/${id}/${verb}`, { method: 'POST', body: JSON.stringify({
      pauseReasonId: intOrNull($('w-reason').value), comment: $('w-comment').value || null })});
    toast('Done', 'ok'); closeModal(); renderWork();
  } catch (e) { toast(e.message, 'bad'); }
}

function askComplete(id) {
  modal(`<h3>Complete work</h3>
    <div class="muted" style="margin-bottom:10px">This moves the task to <b>Completed — ready for QC</b>.
      It does not close it; only QC can do that.</div>
    <label>Resolution</label><textarea id="w-res" rows="3" placeholder="What did you do?"></textarea>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="act ghost" onclick="closeModal()">Cancel</button>
      <button class="act good" onclick="doComplete(${id})">Complete</button></div>`);
}

async function doComplete(id) {
  try {
    await api(`/tasks/${id}/complete`, { method: 'POST', body: JSON.stringify({ resolution: $('w-res').value })});
    toast('Sent to QC', 'ok'); closeModal(); renderWork();
  } catch (e) { toast(e.message, 'bad'); }
}

// ---------------------------------------------------------------- task detail
async function openTask(id) {
  try {
    const t = await api('/tasks/' + id);
    S.taskId = id;

    const history = t.statusHistory.map(h => `<tr>
      <td class="muted">${when(h.changedAt)}</td>
      <td>${pill(h.fromStatus, STATUS_TONE)} → ${pill(h.toStatus, STATUS_TONE)}</td>
      <td class="muted">${esc(h.reason || '')}${h.wasOverride ? ' <span class="pill bad">override</span>' : ''}</td></tr>`).join('');

    const sessions = t.workSessions.map(s => `<tr>
      <td class="muted">${when(s.sessionStart)}</td><td class="muted">${when(s.sessionEnd)}</td>
      <td class="mono">${dur(s.duration)}</td>
      <td>${pill(s.status, STATUS_TONE)}${s.endedByInterruption ? ' <span class="pill warn">interrupted</span>' : ''}</td>
      <td class="muted">${esc(s.endPauseReasonName || s.endComment || '')}</td></tr>`).join('');

    const moves = t.availableTransitions.map(x =>
      `<button class="act ghost" onclick="doTransition(${id},'${x}')">${esc(words(x))}</button>`).join('') ||
      '<span class="muted">No transitions available to you from here.</span>';

    modal(`<h3>${esc(t.taskNumber)} — ${esc(t.title)}</h3>
      <div class="row" style="margin:8px 0 14px">
        ${pill(t.status, STATUS_TONE)} ${pill(t.priority, PRIORITY_TONE)}
        <span class="muted">${esc(t.primaryAssigneeDisplayName || 'unassigned')}</span>
        <span class="muted mono">worked ${dur(t.totalWorkedTime)}</span>
        ${t.requestNumber ? `<span class="pill mute">from ${esc(t.requestNumber)}</span>` : ''}
      </div>
      <div style="white-space:pre-wrap;background:var(--panel-2);padding:12px;border-radius:7px">${esc(t.description)}</div>

      <h2 style="margin-top:18px;font-size:12px;color:var(--muted)">MOVE TO</h2>
      <div class="row">${moves}</div>

      <h2 style="margin-top:18px;font-size:12px;color:var(--muted)">WORK SESSIONS</h2>
      ${table(['Start','End','Duration','Status','Reason'], t.workSessions.length ? [sessions] : [])}

      <h2 style="margin-top:18px;font-size:12px;color:var(--muted)">STATUS HISTORY</h2>
      ${table(['When','Change','Reason'], t.statusHistory.length ? [history] : [])}

      <div class="row" style="margin-top:18px;justify-content:flex-end">
        <button class="act ghost" onclick="closeModal()">Close</button></div>`);
  } catch (e) { toast(e.message, 'bad'); }
}

async function doTransition(id, to) {
  const needsReason = ['Paused','Blocked','QCFailedRework','Cancelled','Reopened','ClarificationRequired','Duplicate','Deferred','OnHold','ReadyForAssignment'].includes(to);
  const reason = needsReason ? prompt(`Reason for moving to ${words(to)}:`) : null;
  if (needsReason && !reason) return;

  try {
    await api(`/tasks/${id}/transition`, { method: 'POST', body: JSON.stringify({
      to, reason,
      // A key makes a double-click safe: the second one is recognised and ignored.
      idempotencyKey: crypto.randomUUID() })});
    toast('Moved to ' + words(to), 'ok');
    closeModal(); openTask(id);
  } catch (e) { toast(e.message, 'bad'); }
}

// ---------------------------------------------------------------- workforce
async function renderPeople() {
  const el = $('v-people');
  if (!can('Workforce.ViewAll')) {
    const tl = await api('/shifts/timeline').catch(() => null);
    el.innerHTML = `<div class="grid">${card('My day', timeline(tl), true)}</div>`;
    return;
  }

  const active = await api('/workforce/active').catch(() => null);
  const tl = await api('/shifts/timeline').catch(() => null);

  el.innerHTML = `<div class="grid">
    ${card('On shift now', `<div class="stats" style="margin-bottom:14px">
        ${stat(active?.totalOnShift ?? 0, 'On shift')}
        ${stat(active?.working ?? 0, 'Working')}
        ${stat(active?.available ?? 0, 'Available')}
        ${stat(active?.away ?? 0, 'Away')}</div>
      ${table(['Person','State','For','Shift length'],
        (active?.workers || []).map(w => `<tr><td>${esc(w.displayName)}</td>
          <td>${pill(w.state, STATUS_TONE)}</td>
          <td class="mono">${dur(w.timeInState)}</td>
          <td class="mono">${dur(w.shiftDuration)}</td></tr>`))}`, true)}
    ${card('My day', timeline(tl), true)}
  </div>`;
}

function timeline(tl) {
  if (!tl || !tl.entries?.length) return '<div class="empty">No activity recorded today.</div>';

  const tone = { Working:'var(--ok)', Available:'var(--info)', Break:'var(--warn)', Lunch:'var(--warn)',
                 Meeting:'var(--warn)', TemporarilyAway:'var(--warn)', ShiftEnded:'var(--line)' };
  const total = tl.entries.reduce((a, e) => a + secs(e.duration), 0) || 1;

  const bar = tl.entries.map(e =>
    `<span style="width:${(secs(e.duration)/total*100).toFixed(2)}%;background:${tone[e.state] || 'var(--line)'}"
       title="${esc(words(e.state || e.label))} · ${dur(e.duration)}"></span>`).join('');

  return `<div class="timeline-bar">${bar}</div>
    <div class="stats" style="margin:14px 0">
      ${stat(dur(tl.totalOnShift), 'On shift')}
      ${stat(dur(tl.totalProductive), 'Productive')}
      ${stat(dur(tl.totalAway), 'Away')}</div>
    ${table(['From','To','Duration','What'], tl.entries.map(e => `<tr>
      <td class="muted">${when(e.from)}</td><td class="muted">${when(e.to)}</td>
      <td class="mono">${dur(e.duration)}</td>
      <td>${esc(e.label)}${e.isOpen ? ' <span class="pill ok">now</span>' : ''}</td></tr>`))}`;
}

const secs = (ts) => { if (!ts) return 0; const [h,m,s] = ts.split(':'); return (+h)*3600 + (+m)*60 + Math.floor(+s); };

// ---------------------------------------------------------------- boot
$('quick').innerHTML = DEMO.map(([u, role]) =>
  `<button onclick="$('u').value='${u}';$('p').value='Demo!Pass123'">${u} <span class="muted">· ${role}</span></button>`).join('');

$('p').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
